<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我們的約定複習站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 教育部標準楷書（中華民國教育部，CC BY-ND 3.0 TW）：先用裝置已安裝的，再載入 fonts 資料夾的字型檔 */
@font-face{font-family:"EduKai";src:local("TW-MOE-Std-Kai"),local("教育部標準楷書"),url("fonts/edukai-4.0.woff2") format("woff2"),url("../fonts/edukai-4.0.woff2") format("woff2");font-display:swap}
/* 版面：和〈我該怎麼辦？課堂導讀〉同一套——米白紙、細線卡片、紅黃藍三色筆標重點、上方黏著的關卡列 */
:root{
  --paper:#fbfaf6; --ink:#2a2733; --muted:#6b6676; --line:#e4e0d6; --card:#ffffff;
  --red:#d9473a; --red-soft:#fbe4e0;
  --yellow:#c99a06; --yellow-soft:#fdf3cc;
  --blue:#2f6fb8; --blue-soft:#e0ecf9;
  --ok:#2e9b5b; --ok-soft:#e1f3e8;
  --note:#fff7d6; --note-edge:#e2c24a;
  --qr-dark:#000000; --qr-light:#ffffff;
  --font-display:"EduKai","TW-MOE-Std-Kai","教育部標準楷書","DFKai-SB","BiauKai","標楷體","Kaiti TC",serif;
  --font-body:"EduKai","TW-MOE-Std-Kai","教育部標準楷書","DFKai-SB","BiauKai","標楷體","Kaiti TC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1c1b21; --ink:#ece9f2; --muted:#a39fae; --line:#34323c; --card:#25242b;
  --red:#ff7b6c; --red-soft:#4a2723; --yellow:#f2c94c; --yellow-soft:#3f3518;
  --blue:#76aaf0; --blue-soft:#1f3049; --ok:#5cc98a; --ok-soft:#1e3a2a;
  --note:#353019; --note-edge:#9c8530; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1b21; --ink:#ece9f2; --muted:#a39fae; --line:#34323c; --card:#25242b;
  --red:#ff7b6c; --red-soft:#4a2723; --yellow:#f2c94c; --yellow-soft:#3f3518;
  --blue:#76aaf0; --blue-soft:#1f3049; --ok:#5cc98a; --ok-soft:#1e3a2a;
  --note:#353019; --note-edge:#9c8530; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{font-synthesis:none}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:1.15rem;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 4rem;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
.wrap{max-width:52rem;margin:0 auto}
body.big .wrap{max-width:72rem}

/* 田字格 */
.tz{display:inline-flex;gap:.35rem;flex-wrap:wrap;justify-content:center}
.tz span{width:var(--s,64px);height:var(--s,64px);display:inline-grid;place-items:center;font-family:var(--font-display);font-size:calc(var(--s,64px)*.66);line-height:1;border-radius:6px;
  background:linear-gradient(var(--red-soft),var(--red-soft)) center/1px 100% no-repeat,linear-gradient(var(--red-soft),var(--red-soft)) center/100% 1px no-repeat,var(--card);border:2px solid var(--red-soft)}
.tz span.r,.tz span.key{color:var(--red);border-color:var(--red)}

/* 首頁 */
.hero{padding-block:2.5rem 1.2rem;display:grid;gap:.8rem}
.lesson{font-size:.85rem;letter-spacing:.15em;color:var(--muted)}
.hero h1{font-size:clamp(2.4rem,7vw,3.6rem)}
.pens{display:flex;gap:.5rem;flex-wrap:wrap}
.pen{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-display);font-size:1.05rem;padding:.15rem .8rem .15rem .3rem;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.pen i{width:1.3rem;height:.5rem;border-radius:2px 8px 8px 2px;display:inline-block}
.goal{color:var(--muted);max-width:40rem}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem}
.mode{--c:var(--blue);display:grid;gap:.3rem;align-content:start;text-align:left;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:10px;padding:.9rem 1rem}
.mode.stu{--c:var(--red)}
.mode b{font-family:var(--font-display);font-size:1.45rem;color:var(--c);font-weight:700}
.mode small{color:var(--muted);font-size:.92rem;line-height:1.6}
.mode .tag{justify-self:start;font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--card);background:var(--c);border-radius:4px;padding:.1rem .45rem}
.mode:active{transform:scale(.99)}
.panel{margin-top:2.2rem;padding-top:2rem;border-top:1px dashed var(--line);display:grid;gap:.8rem}
.panel h2{font-size:1.75rem}
.panel .hint{color:var(--muted);font-size:.95rem}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.plan li{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .9rem}
.plan .no{font-family:var(--font-display);font-size:1.8rem;color:var(--red);line-height:1}
.plan .what{min-width:0;display:grid}
.plan .what b{font-family:var(--font-display);font-size:1.2rem;font-weight:700}
.plan .what small{color:var(--muted);font-size:.85rem;line-height:1.5}
.plan .min{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 .6rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.plan button{font-size:.85rem;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:.3rem .8rem}
@media (max-width:30rem){.plan li{grid-template-columns:2rem 1fr auto}.plan .min{display:none}}
.note{margin-top:2rem;text-align:center;color:var(--muted);font-size:.8rem}

/* 上方黏著的工具列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.5rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar-in{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.bar h2{font-size:clamp(1.3rem,2.4vw,1.8rem);flex:1;min-width:0}
.back,.timer{font-size:.85rem;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.25rem .65rem}
.timer{font-variant-numeric:tabular-nums}
.timer.run{border-color:var(--blue);color:var(--blue)}
.timer.end{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.tabs{display:flex;gap:.3rem;overflow-x:auto;padding:.4rem 0 2px;scrollbar-width:thin;width:100%}
.tabs button{flex:none;font-size:.82rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:99px;padding:.15rem .65rem;white-space:nowrap}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.score{font-size:.85rem;color:var(--muted)}
.score b{color:var(--red);font-size:1.15rem}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:1rem 0 1.2rem}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}

/* 短文（便條紙） */
.passage{background:var(--note);border:1px solid var(--note-edge);border-radius:4px;padding:.4rem 1.1rem .8rem;margin-bottom:1rem}
.passage summary{cursor:pointer;display:inline-flex;font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--red);border:2px solid var(--red);border-radius:6px;padding:0 .5rem;transform:rotate(-2deg);margin:.4rem 0}
.passage p{margin:.3rem 0;text-indent:2em;font-family:var(--font-display);font-size:clamp(1.1rem,2.2vw,1.4rem);line-height:1.9}
body.big .passage p{font-size:clamp(1.3rem,2.4vw,1.85rem)}

/* 題目卡 */
.qcard{background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:1.2rem 1.2rem 1.4rem;display:grid;gap:.7rem;justify-items:center;text-align:center}
.qtag{justify-self:start;font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--card);background:var(--blue);border-radius:6px;padding:.15rem .5rem}
.qtext{font-family:var(--font-display);font-size:clamp(1.35rem,4.6vw,1.8rem);line-height:1.7;margin:0}
div.qtext{width:100%}
body.big .qtext{font-size:clamp(1.8rem,3.6vw,3rem)}
.qtext em{font-style:normal;color:var(--red);background:var(--red-soft);border-radius:4px;padding:0 .15em}
.qtext .blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--red);margin:0 .2em}
.qtext .pic{font-size:1.6em;display:block;line-height:1.3}
.sent{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:.15em .1em}
.sent .plain{padding-top:.1em}
.ck,.slot{display:inline-flex;flex-direction:column;align-items:center;line-height:1.3}
.ck{border-radius:6px;padding:.1em .3em;border:2px solid var(--c)}
.ck small,.slot small{font-family:var(--font-body);font-size:.42em;font-weight:700;color:var(--c);white-space:nowrap;margin-top:.2em;letter-spacing:.05em}
.ck.n,.slot.n{--c:var(--red)} .ck.n{background:var(--red-soft)}
.ck.q,.slot.q{--c:var(--yellow)} .ck.q{background:var(--yellow-soft)}
.ck.a,.slot.a{--c:var(--blue)} .ck.a{background:var(--blue-soft)}
.slot i{display:block;width:2.6em;height:1.25em;border-bottom:3px solid var(--c)}
.slot.q i{width:1.8em}
.slot.w i{width:5em}
.qtext .ask{display:block;font-family:var(--font-body);font-size:.6em;color:var(--blue);font-weight:700;margin-top:.4em;letter-spacing:.05em}
.zy{letter-spacing:.06em}

/* 多音字表 */
.yin{display:grid;gap:.8rem;text-align:left}
.yrow{display:flex;gap:.8rem;align-items:stretch}
.ych{flex:none;width:1.8em;display:grid;place-items:center;font-size:1.5em;color:var(--red);border:2px solid var(--red);border-radius:6px;
  background:linear-gradient(var(--red-soft),var(--red-soft)) center/1px 100% no-repeat,linear-gradient(var(--red-soft),var(--red-soft)) center/100% 1px no-repeat,var(--card)}
.ytiles{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.5rem}
.ytile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.4rem .7rem;display:flex;flex-direction:column;line-height:1.4}
.ytile b{font-weight:700;color:var(--blue);white-space:nowrap;letter-spacing:.08em}
.ytile span{font-size:.72em}
.ytile small{font-family:var(--font-body);font-size:.5em;color:var(--muted)}
@media (max-width:560px){.ytiles{grid-template-columns:1fr}}

/* 選項 */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.long{grid-template-columns:1fr}
.choice{position:relative;font-family:var(--font-display);font-size:clamp(1.3rem,5vw,1.7rem);line-height:1.4;min-height:3.6rem;padding:.4rem .5rem;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.choice:hover:not(:disabled){border-color:var(--blue)}
body.big .choice{font-size:clamp(1.7rem,3.2vw,2.6rem);min-height:5rem}
.choices.long .choice{text-align:left;padding:.6rem 1rem;font-size:clamp(1.1rem,4.4vw,1.4rem)}
body.big .choices.long .choice{font-size:clamp(1.4rem,2.6vw,2.1rem)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.choice.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);text-decoration:line-through}
.choice.dim{opacity:.45}
.circle{position:absolute;inset:-6px;border:3px solid var(--red);border-radius:50%;pointer-events:none;animation:draw .35s ease-out}
@keyframes draw{from{transform:scale(1.3);opacity:0}to{transform:scale(1);opacity:1}}

/* 回饋（便條紙） */
.feedback{margin-top:1rem;text-align:left;border-radius:4px;padding:.8rem 1.1rem;background:var(--note);border:1px solid var(--note-edge);animation:pop .25s ease-out;width:100%}
.feedback h3{font-size:1.25rem;margin-bottom:.15rem}
.feedback.good h3{color:var(--ok)}
.feedback.bad h3{color:var(--red)}
.feedback p{font-size:1rem}
.feedback.info p{font-family:var(--font-display);font-size:1.2rem}
.feedback.info b,.feedback p b{color:var(--blue)}
body.big .feedback h3{font-size:1.8rem}
body.big .feedback p{font-size:clamp(1.2rem,2.2vw,1.7rem)}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.reveal{font-size:.95rem;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:.4rem 1.1rem}
body.big .reveal{font-size:1.3rem}

/* 成語卡 */
.flip{cursor:pointer;min-height:16rem;align-content:center}
.flip .tz{--s:clamp(60px,15vw,96px)}
body.big .flip .tz{--s:clamp(80px,10vw,130px)}
.flip .hint{color:var(--blue);font-size:.85rem}
.flip .backside{width:100%;text-align:left;display:grid;gap:.3rem;border-top:1px dashed var(--line);padding-top:.8rem}
.flip .backside p{font-family:var(--font-display);font-size:clamp(1.1rem,4.4vw,1.4rem)}
body.big .flip .backside p{font-size:clamp(1.4rem,2.6vw,2rem)}
.tagred,.tagblue{display:inline-block;font-family:var(--font-body);font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--card);border-radius:4px;padding:.05rem .45rem;margin-right:.5rem;vertical-align:.2em}
.tagred{background:var(--red)}
.tagblue{background:var(--blue)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.btn{font-size:.95rem;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:8px;padding:.45rem 1.1rem}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
body.big .btn{font-size:1.25rem;padding:.6rem 1.4rem}
.keys{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}

/* 結果 */
.result{text-align:center}
.stamp{display:inline-grid;place-items:center;width:9rem;height:9rem;border-radius:50%;border:5px double var(--red);color:var(--red);font-family:var(--font-display);font-size:2.4rem;transform:rotate(-12deg);margin:1.5rem auto .5rem;animation:stamp .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.result .big{font-family:var(--font-display);font-size:1.6rem}
.wronglist{text-align:left;margin-top:1.5rem;display:grid;gap:.5rem}
.wronglist h3{font-size:1.3rem}
.witem{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:.6rem .9rem}
.witem p{font-size:.95rem}
.witem .ans{color:var(--ok)}
.actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}


/* 小豆子走廊舞臺：右邊留給教室門 */
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.3rem 1rem .5rem;margin:1rem 0;position:relative;overflow:hidden}
.sky{position:relative;height:72px}
.lark{position:absolute;bottom:-6px;width:44px;transform:translateX(-50%);transition:left .55s cubic-bezier(.4,1.3,.6,1);z-index:2}
.lark svg{display:block;width:100%;height:auto}
.lark.hop svg{animation:hop .55s}
.lark.sad svg{animation:shake .45s}
.lark.sing svg{animation:hop .3s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-6deg)}}
@keyframes shake{25%{transform:translateX(-5px) rotate(-8deg)}75%{transform:translateX(5px) rotate(8deg)}}
.combo{position:absolute;right:0;top:4px;font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--yellow);background:var(--yellow-soft);border-radius:8px;padding:0 .6rem;animation:combo 1.8s ease-out forwards}
@keyframes combo{0%{transform:scale(.6);opacity:0}15%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{opacity:0}}
.staff{position:relative;height:118px}
.staff>i{position:absolute;left:0;right:0;height:1px;background:var(--muted);opacity:.4}
.slotdot{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:var(--line);transform:translate(-50%,-50%)}
.rest{position:absolute;top:50%;width:12px;height:6px;border-radius:2px;background:var(--muted);opacity:.35;transform:translate(-50%,-100%)}
.nt{position:absolute;width:20px;height:40px;transform:translate(-50%,-82%);color:var(--blue);transition:color .2s}
.nt svg{display:block;width:100%;height:100%}
.nt.gold{color:var(--yellow);filter:drop-shadow(0 0 4px var(--yellow))}
.nt.lit{color:var(--red)}
.nt.lit svg{animation:hop .35s}
.nt.pop svg{animation:notepop .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes notepop{from{transform:scale(0) translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.nt.ledger::after{content:"";position:absolute;left:-4px;width:24px;bottom:6px;height:1px;background:var(--muted);opacity:.6}
.stage-foot{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stage-foot b{color:var(--blue);font-size:1.05rem}
.btn.sing{display:block;margin:0 auto;background:var(--blue);border-color:var(--blue);color:var(--card)}
.result .sub{color:var(--muted);font-size:.95rem}
@media (max-width:30rem){.nt{width:16px;height:32px}.lark{width:36px}.stage{padding-inline:.6rem}}

/* QR code 視窗 */
.qrwrap{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 55%,transparent);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.qrbox{background:var(--card);border-radius:16px;border-top:6px solid var(--red);padding:1.2rem 1.4rem 1.4rem;display:grid;gap:.8rem;justify-items:center;text-align:center;max-width:min(40rem,100%)}
.qrbox h2{font-size:clamp(1.5rem,3.6vw,2.4rem)}
.qrcode{background:var(--qr-light);padding:6px;border-radius:10px;line-height:0}
.qrcode svg{display:block;width:min(60vh,72vw,26rem);height:auto}
.qrurl{font-size:.85rem;color:var(--muted);word-break:break-all;max-width:30rem}
.qredit{width:100%;text-align:left;font-size:.9rem}
.qredit summary{cursor:pointer;color:var(--blue)}
.qredit label{display:block;margin:.4rem 0 .3rem;color:var(--muted)}
.qrrow{display:flex;gap:.4rem;flex-wrap:wrap}
.qrrow input{flex:1;min-width:12rem;font:inherit;font-size:.95rem;padding:.4rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.qrbtn{font-size:.85rem;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.25rem .65rem}
.stage{padding-right:3.6rem!important}
.door{position:absolute;right:.6rem;top:.6rem;width:2.6rem}
.door svg{display:block;width:100%;height:auto}
.sky{height:76px}
.lark.hop svg,.lark.sing svg{animation:step .5s}
@keyframes step{0%,100%{transform:translateY(0)}30%{transform:translateY(-6px) rotate(4deg)}60%{transform:translateY(-2px) rotate(-3deg)}}
.hall{font-family:var(--font-display);color:var(--muted)}
@media (max-width:30rem){.stage{padding-right:2.8rem!important}.door{width:2rem}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="qrwrap" id="qr" hidden>
  <div class="qrbox" role="dialog" aria-modal="true" aria-labelledby="qrt">

/* ===================== 工具 ===================== */
const app = document.getElementById("app");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s).replace(/<span class='blank'><\/span>/g,"（　）").replace(/<br>/g," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ");
const isZY = o => /^[ㄅ-ㄩˊˇˋ˙ ]+$/.test(o);
// 每題的選項先排好順序（注音與○✕題保持原順序，方便全班對照）
STATIONS.forEach(s=>s.items.forEach(it=>{
  if(it.t==="mc"){
    const keep = it.opts.every(isZY) || it.opts[0].startsWith("○");
    it.order = keep ? it.opts.map((_,i)=>i) : shuffle(it.opts.map((_,i)=>i));
  }
}));

let timer = {left:0, id:null, st:-1};

function setBig(on){ document.body.classList.toggle("big", !!on); }

/* ===================== 計時器 ===================== */
function stopTimer(){ clearInterval(timer.id); timer.id=null; }
function timerLabel(){
  if(timer.st!==S.st){ return `計時 ${STATIONS[S.st].min}:00`; }
  const m=Math.floor(timer.left/60), s=String(timer.left%60).padStart(2,"0");
  return timer.left<=0 ? "時間到" : `${timer.id?"":"暫停 "}${m}:${s}`;
}
function paintTimer(){
  const el=document.getElementById("timer"); if(!el) return;
  el.textContent = timerLabel();
  el.className = "timer" + (timer.st===S.st ? (timer.left<=0?" end":timer.id?" run":"") : "");
}
function toggleTimer(){
  if(timer.st!==S.st || timer.left<=0){ stopTimer(); timer.st=S.st; timer.left=STATIONS[S.st].min*60; }
  if(timer.id){ stopTimer(); }
  else { timer.id=setInterval(()=>{ timer.left--; if(timer.left<=0){ timer.left=0; stopTimer(); } paintTimer(); },1000); }
  paintTimer();
}

/* ===================== 題目卡 ===================== */
function passageHTML(open){
  return `<details class="passage" ${open?"open":""}><summary>短文　小河邊的約定</summary>${PASSAGE.map(p=>`<p>${p}</p>`).join("")}</details>`;
}
function mcHTML(it, chosen){
  const done = chosen!==undefined;
  const cls = it.long ? "long" : (it.opts.length===3 ? "three" : "");
  const btns = it.order.map(i=>{
    let c="choice";
    if(done){ if(i===it.a) c+=" right"; else if(i===chosen) c+=" wrong"; else c+=" dim"; }
    return `<button class="${c}" data-i="${i}" ${done?"disabled":""}>${esc(it.opts[i])}${done&&i===it.a?'<span class="circle"></span>':""}</button>`;
  }).join("");
  let fb="";
  if(done){
    const ok = chosen===it.a;
    fb = `<div class="feedback ${ok?"good":"bad"}" role="status"><h3>${ok?"答對了！":"再想想，答案是「"+esc(it.opts[it.a])+"」"}</h3><p>${it.ex}</p></div>`;
  }
  return `<div class="qcard"><span class="qtag">${it.tag}</span><p class="qtext">${it.q}</p></div><div class="choices ${cls}">${btns}</div>${fb}`;
}
function openHTML(it, shown){
  return `<div class="qcard"><span class="qtag">${it.tag}</span><div class="qtext">${it.q}</div>
    ${shown?`<div class="feedback info" role="status"><p>${it.ans}</p></div>`:`<button class="reveal" id="rv">看參考答案</button>`}</div>`;
}
function cardHTML(it, shown){
  const chars=[...it.w].map(c=>`<span class="${c===it.k?"key":""}">${c}</span>`).join("");
  return `<div class="qcard flip" id="rv" role="button" tabindex="0" aria-label="翻開成語卡">
    <span class="qtag">成語卡 · 藏著生字「${it.k}」</span>
    <div class="tz">${chars}</div>
    ${shown?`<div class="backside">
      <p><span class="tagblue">注音</span><span class="zy">${it.zy}</span></p>
      <p><span class="tagred">意思</span>${it.m}</p>
      <p><span class="tagblue">例句</span>${it.s}</p></div>`
    :`<span class="hint">先猜猜看是什麼意思？點一下翻開</span>`}
  </div>`;
}

/* ===================== 老師模式 ===================== */
function teacher(st, i=0){
  S.mode="t"; S.st=st; S.i=i; setBig(true);
  if(timer.st!==st){ stopTimer(); }
  renderT(); scrollTo(0,0);
}
function renderT(){
  const st=STATIONS[S.st], it=st.items[S.i], key=S.st+"-"+S.i;
  let body="";
  if(it.t==="mc") body=mcHTML(it, S.ans[key]);
  else if(it.t==="open") body=openHTML(it, S.open[key]);
  else body=cardHTML(it, S.open[key]);
  const last = S.i===st.items.length-1, lastSt = S.st===STATIONS.length-1;
  app.innerHTML = `
    <div class="bar"><div class="bar-in"><button class="back" id="home">← 首頁</button><h2>${st.name}</h2><button class="qrbtn" id="qrb">QR code</button><button class="timer" id="timer"></button>
    <nav class="tabs" aria-label="關卡">${STATIONS.map((s,k)=>`<button data-st="${k}" aria-current="${k===S.st}">${k+1} ${s.name}</button>`).join("")}</nav></div></div>
    <div class="progress"><i style="width:${(S.i+1)/st.items.length*100}%"></i></div>
    ${st.passage?passageHTML(true):""}
    ${body}
    <div class="nav">
      <button class="btn ghost" id="prev" ${S.i===0&&S.st===0?"disabled":""}>← 上一題</button>
      <span class="keys">${S.i+1} / ${st.items.length}</span>
      <button class="btn" id="next" ${last&&lastSt?"disabled":""}>${last?(lastSt?"全部完成":"下一關 →"):"下一題 →"}</button>
    </div>`;
  paintTimer();
  document.getElementById("home").onclick=home;
  document.getElementById("timer").onclick=toggleTimer;
  document.getElementById("qrb").onclick=openQR;
  app.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>teacher(+b.dataset.st));
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ S.ans[key]=+b.dataset.i; renderT(); });
  const rv=document.getElementById("rv");
  if(rv) { rv.onclick=()=>{ S.open[key]=!S.open[key]; renderT(); }; rv.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); rv.click(); } }; }
  document.getElementById("prev").onclick=()=>stepT(-1);
  document.getElementById("next").onclick=()=>stepT(1);
}
function stepT(d){
  const st=STATIONS[S.st];
  let i=S.i+d, s=S.st;
  if(i<0){ if(s===0) return; s--; i=STATIONS[s].items.length-1; }
  else if(i>=st.items.length){ if(s===STATIONS.length-1) return; s++; i=0; }
  if(s!==S.st) teacher(s,i); else { S.i=i; renderT(); }
}
document.addEventListener("keydown",e=>{
  if(S.mode!=="t" || !document.getElementById("qr").hidden) return;
  if(e.target.closest && e.target.closest("details,summary")) return;
  if(e.key==="ArrowRight"){ e.preventDefault(); stepT(1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); stepT(-1); }
  else if(e.key===" "){ const rv=document.getElementById("rv"); if(rv){ e.preventDefault(); rv.click(); } }
});

/* ===================== 學生模式：小豆子哼歌回教室 ===================== */
// 〈小星星〉（法國民謠，公眾領域）：1 1 5 5 6 6 5－｜4 4 3 3 2 2 1－，每題一個音；答對才收集到，答錯是休止符
const MELODY=[0,0,4,4,5,5,4,3,3,2,2,1,1,0];
const BEATS =[1,1,1,1,1,1,2,1,1,1,1,1,1,2];
const FREQ=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];
const NOTE_SVG='<svg viewBox="0 0 20 40" aria-hidden="true"><ellipse cx="8" cy="33" rx="7" ry="5" transform="rotate(-20 8 33)" fill="currentColor"/><rect x="13" y="4" width="2.2" height="29" fill="currentColor"/><path d="M15 4c3 4 6 6 4 12c0-4-2-6-4-7z" fill="currentColor"/></svg>';
const LARK_SVG='<svg viewBox="0 0 48 64" aria-hidden="true"><ellipse cx="24" cy="61" rx="13" ry="2.5" fill="#000" opacity=".12"/><path d="M17 44l-3 15h6l3-12zM27 44l4 15h6l-4-15z" fill="#2f4a7a"/><path d="M13 58h8v3h-9zM30 58h8l1 3h-9z" fill="#c0392b"/><rect x="13" y="28" width="22" height="18" rx="6" fill="#4fa36b"/><path d="M13 33h22M13 38h22" stroke="#fff" stroke-width="2" opacity=".7"/><path d="M14 31l-6 9M34 31l6 7" stroke="#f2c7a5" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="17" r="11" fill="#f2c7a5"/><path d="M13 16c0-8 6-12 12-12s11 4 11 10c-3-2-6-3-9-3-4 0-9 2-14 5z" fill="#3a2a20"/><circle cx="28" cy="18" r="1.6" fill="#2a2733"/><circle cx="20" cy="18" r="1.6" fill="#2a2733"/><circle cx="31" cy="22" r="2.2" fill="#f19b8e" opacity=".6"/><path d="M22 24q3 2 6 0" stroke="#7a3a2a" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
const DOOR_SVG='<svg viewBox="0 0 44 70" aria-hidden="true"><rect x="2" y="12" width="40" height="58" rx="2" fill="#8a6a4a"/><rect x="6" y="16" width="32" height="54" fill="#b58a5e"/><rect x="11" y="22" width="22" height="16" fill="#cfe6f5" stroke="#8a6a4a" stroke-width="2"/><circle cx="33" cy="46" r="2.2" fill="#e3c04a"/><rect x="4" y="0" width="36" height="11" rx="2" fill="#fff" stroke="#8a6a4a" stroke-width="1.5"/><text x="22" y="8.6" text-anchor="middle" font-size="8" fill="#2a2733" font-family="sans-serif">教室</text></svg>';

let actx=null, sound=true;
function tone(f,dur=.25,type="triangle",when=0,vol=.16){
  if(!sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const t=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const pitchOf=k=>MELODY[k%MELODY.length];
const slotX=(k,n)=>(k+.5)/n*100;

function student(){
  setBig(false); stopTimer();
  const per = STATIONS.map(s=>shuffle(s.items.filter(it=>it.t==="mc")));
  let pick=[], rest=[];
  per.forEach(list=>{ pick.push(...list.slice(0,2)); rest.push(...list.slice(2)); });
  pick.push(...shuffle(rest).slice(0, 14-pick.length));
  pick = shuffle(pick.filter(it=>!it.passage)).concat(pick.filter(it=>it.passage));
  const list = pick.map(it=>({it, order: it.order.every((v,i)=>v===i)? it.order : shuffle(it.order)}));
  S.mode="s";
  S.quiz={list, i:0, ans:[], slots:Array(list.length).fill(null), streak:0, best:0, pop:-1, combo:0,
          birdFrom:slotX(0,list.length), birdCls:"", rescue:null, ri:0, rans:{}};
  renderS(); scrollTo(0,0);
}

function stageHTML(Q, curK){
  const n=Q.list.length;
  const got=Q.slots.filter(x=>x==="note"||x==="gold").length;
  const marks=Q.slots.map((sl,k)=>{
    const x=slotX(k,n);
    if(!sl) return `<span class="slotdot" style="left:${x}%"></span>`;
    if(sl==="rest") return `<span class="rest" style="left:${x}%"></span>`;
    const st=pitchOf(k), y=78-(st-2)*7;
    return `<span class="nt ${sl==="gold"?"gold":""} ${k===Q.pop?"pop":""} ${st===0?"ledger":""}" data-k="${k}" style="left:${x}%;top:${y}%">${NOTE_SVG}</span>`;
  }).join("");
  return `<div class="stage" aria-label="已收集 ${got} 個音符">
    <div class="door">${DOOR_SVG}</div>
    <div class="sky">
      <div class="lark ${Q.birdCls}" id="lark" style="left:${Q.birdFrom}%">${LARK_SVG}</div>
      ${Q.combo?`<span class="combo" role="status">連擊 ×${Q.combo}！金色音符</span>`:""}
    </div>
    <div class="staff"><i style="top:22%"></i><i style="top:36%"></i><i style="top:50%"></i><i style="top:64%"></i><i style="top:78%"></i>${marks}</div>
    <div class="stage-foot"><span>音符 <b>${got}</b> / ${n}</span><span class="hall">走廊慢慢走</span><span>連對 <b>${Q.streak}</b> 題</span></div>
  </div>`;
}
function flyBird(Q, toK){
  const el=document.getElementById("lark"); if(!el) return;
  const to=slotX(toK,Q.list.length);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.left=to+"%"; }));
  Q.birdFrom=to;
}

function answerS(Q, k, chosen, isRescue){
  const it=Q.list[k].it, ok=chosen===it.a;
  Q.pop=-1; Q.combo=0;
  if(isRescue){
    Q.rans[k]=chosen;
    if(ok){ Q.slots[k]="note"; Q.pop=k; Q.birdCls="hop"; tone(FREQ[pitchOf(k)]*2,.3); tone(1568,.1,"sine",.12,.08); }
    else { Q.birdCls="sad"; tone(196,.3,"sine"); }
    return;
  }
  Q.ans[k]=chosen;
  if(ok){
    Q.streak++; Q.best=Math.max(Q.best,Q.streak);
    const gold = Q.streak%3===0;
    Q.slots[k]= gold ? "gold" : "note"; Q.pop=k; Q.birdCls="hop";
    const f=FREQ[pitchOf(k)];
    tone(f*2,.3); tone(f*3,.12,"sine",.12,.07);
    if(gold){ Q.combo=Q.streak; [1,1.25,1.5,2].forEach((m,j)=>tone(f*2*m,.18,"sine",.15+j*.09,.1)); }
  }else{
    Q.streak=0; Q.slots[k]="rest"; Q.birdCls="sad"; tone(196,.3,"sine");
  }
}

function renderS(){
  const Q=S.quiz, n=Q.list.length;
  const rescue=!!Q.rescue;
  if(!rescue && Q.i>=n) return resultS();
  if(rescue && Q.ri>=Q.rescue.length){ Q.rescue=null; return resultS(); }
  const k = rescue ? Q.rescue[Q.ri] : Q.i;
  const cur=Q.list[k], it={...cur.it, order:cur.order};
  const chosen = rescue ? Q.rans[k] : Q.ans[k];
  const last = rescue ? Q.ri===Q.rescue.length-1 : Q.i===n-1;
  const title = rescue ? `救援任務 ${Q.ri+1} / ${Q.rescue.length}` : `第 ${Q.i+1} 題 / ${n}`;
  app.innerHTML = `
    <div class="bar"><div class="bar-in"><button class="back" id="home">← 首頁</button><h2>${title}</h2><button class="back" id="snd" aria-pressed="${sound}">聲音：${sound?"開":"關"}</button></div></div>
    ${stageHTML(Q,k)}
    ${it.passage?passageHTML(true):""}
    ${mcHTML(it, chosen)}
    ${chosen!==undefined?`<div class="nav"><span></span><button class="btn" id="next">${last?"看結果":"下一題 →"}</button></div>`:""}`;
  flyBird(Q,k); Q.birdCls="";
  document.getElementById("home").onclick=home;
  document.getElementById("snd").onclick=()=>{ sound=!sound; renderS(); };
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{ answerS(Q,k,+b.dataset.i,rescue); renderS(); });
  const nx=document.getElementById("next");
  if(nx){ nx.onclick=()=>{ Q.pop=-1; Q.combo=0; if(rescue) Q.ri++; else Q.i++; renderS(); scrollTo(0,0); }; nx.focus({preventScroll:true}); }
}

function resultS(){
  const Q=S.quiz, n=Q.list.length;
  Q.pop=-1; Q.combo=0; Q.birdCls=""; Q.birdFrom=100;
  const first=Q.list.filter((p,k)=>Q.ans[k]===p.it.a).length;
  const got=Q.slots.filter(x=>x==="note"||x==="gold").length;
  const rests=Q.slots.map((x,k)=>x==="rest"?k:-1).filter(k=>k>=0);
  const word = got===n ? "滿分" : got>=11 ? "很棒" : got>=8 ? "不錯" : "加油";
  app.innerHTML = `
    <div class="result">
      <div class="bar"><div class="bar-in"><button class="back" id="home">← 首頁</button><h2>挑戰完成</h2><button class="back" id="snd" aria-pressed="${sound}">聲音：${sound?"開":"關"}</button></div></div>
      ${stageHTML(Q,0)}
      <button class="btn sing" id="sing">♪ 聽小豆子哼歌</button>
      <div><div class="stamp">${word}</div></div>
      <p class="big">收集 ${got} / ${n} 個音符</p>
      <p class="sub">第一次就答對 ${first} 題・最多連對 ${Q.best} 題</p>
      ${rests.length?`<div class="wronglist"><h3>還缺 ${rests.length} 個音符，完成救援任務就能補回來</h3>${rests.map(k=>{const it=Q.list[k].it;return `
        <div class="witem"><p>${strip(it.q)}</p></div>`}).join("")}</div>`
      :`<p class="sub">每一個音符都收集到了，小豆子哼完整首〈小星星〉，走進教室了！</p>`}
      <div class="actions">
        ${rests.length?`<button class="btn" id="rescue">救援任務（${rests.length} 題）</button>`:""}
        <button class="btn ghost" id="again">再挑戰一次</button><button class="btn ghost" id="home2">回首頁</button>
      </div>
    </div>`;
  document.getElementById("home").onclick=home;
  document.getElementById("home2").onclick=home;
  document.getElementById("again").onclick=student;
  document.getElementById("snd").onclick=()=>{ sound=!sound; resultS(); };
  document.getElementById("sing").onclick=sing;
  const r=document.getElementById("rescue");
  if(r) r.onclick=()=>{ Q.rescue=shuffle(rests); Q.ri=0; Q.rans={}; renderS(); scrollTo(0,0); };
  scrollTo(0,0);
}

let singing=null;
function sing(){
  const Q=S.quiz, n=Q.list.length, el=document.getElementById("lark");
  clearTimeout(singing);
  const was=sound; sound=true;
  let k=0;
  const step=()=>{
    document.querySelectorAll(".nt.lit").forEach(x=>x.classList.remove("lit"));
    if(k>=n){ sound=was; if(el){ el.classList.remove("sing"); el.style.left="100%"; } return; }
    if(el){ el.style.left=slotX(k,n)+"%"; el.classList.remove("sing"); void el.offsetWidth; el.classList.add("sing"); }
    const sl=Q.slots[k];
    if(sl==="note"||sl==="gold"){
      tone(FREQ[pitchOf(k)]*2,.34*BEATS[k%BEATS.length]+.05,"triangle",0,.18);
      const nt=document.querySelector(`.nt[data-k="${k}"]`); if(nt) nt.classList.add("lit");
    }
    const beat=BEATS[k%BEATS.length]; k++; singing=setTimeout(step,400*beat);
  };
  step();
}


/* ===================== QR code ===================== */
const ARTIFACT_URL="https://claude.ai/artifact/A3dtJJXUMKvAxM3RsDBVYK";
function defaultURL(){
  const h=location.hostname||"";
  const hosted = /^https?:$/.test(location.protocol) && !/claude|anthropic|localhost|127\.0\.0\.1/.test(h);
  return (hosted ? location.href.split("#")[0] : ARTIFACT_URL) + "#play";
}
function qrURL(){ try{ return localStorage.getItem("qr-url") || defaultURL(); }catch(e){ return defaultURL(); } }
let lastFocus=null;
function drawQR(url){
  const box=document.getElementById("qrcode"); box.innerHTML="";
  document.getElementById("qrurl").textContent=url;
  const cs=getComputedStyle(document.documentElement);
  try{
    const q=qrcode(0,"M"); q.addData(url); q.make();
    const n=q.getModuleCount(); let d="";
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;
    const dark=cs.getPropertyValue("--qr-dark").trim()||"#000", light=cs.getPropertyValue("--qr-light").trim()||"#fff";
    box.innerHTML=`<svg viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="QR code：${esc(url)}"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="${light}"/><path d="${d}" fill="${dark}"/></svg>`;
  }catch(e){
    box.innerHTML='<p style="line-height:1.6;color:#000">網址太長，無法做成 QR code。<br>請學生直接輸入下方網址。</p>';
  }
}
function openQR(){
  lastFocus=document.activeElement;
  const url=qrURL();
  document.getElementById("qrinput").value=url;
  drawQR(url);
  document.getElementById("qr").hidden=false;
  document.getElementById("qrclose").focus();
}
function closeQR(){ document.getElementById("qr").hidden=true; if(lastFocus) lastFocus.focus(); }
document.getElementById("qrclose").onclick=closeQR;
document.getElementById("qr").addEventListener("click",e=>{ if(e.target.id==="qr") closeQR(); });
document.getElementById("qrsave").onclick=()=>{
  let v=document.getElementById("qrinput").value.trim(); if(!v) return;
  if(!/^https?:\/\//.test(v)) v="https://"+v;
  if(!v.includes("#")) v+="#play";
  try{ localStorage.setItem("qr-url",v); }catch(e){}
  document.getElementById("qrinput").value=v; drawQR(v);
};
document.getElementById("qrreset").onclick=()=>{ try{ localStorage.removeItem("qr-url"); }catch(e){} const v=defaultURL(); document.getElementById("qrinput").value=v; drawQR(v); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !document.getElementById("qr").hidden) closeQR(); });

// 掃 QR code 進來（網址結尾是 #play）就直接開始挑戰
if(location.hash==="#play") student(); else home();
</script>
