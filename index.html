/* ===================== 狀態 ===================== */
let CUR=1, SECTIONS=[], PASSAGE=[], PTITLE="", ALL=[], BY={}, KEY="", ST={m:{},fixed:{}};
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} };
function load(n){
  CUR=n; const L=LESSONS[n];
  SECTIONS=L.sections; PASSAGE=L.passage||[]; PTITLE=L.ptitle||"";
  ALL=SECTIONS.flatMap(s=>s.items.map(it=>({...it,sec:s})));
  BY=Object.fromEntries(ALL.map(it=>[it.id,it]));
  KEY = n===1 ? "lesson1-exam-review-v2" : "exam-review-l"+n;
  try{ ST=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ ST={}; }
  ST.m=ST.m||{}; ST.fixed=ST.fixed||{};
  stage=ST.stage||1; quiz=null;
  if(stage===2 && !allMarked()) stage=1;
  try{ localStorage.setItem("exam-review-last",String(n)); }catch(e){}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>String(s).replace(/<span class='ask'>.*?<\/span>/g,"").replace(/<br>.*/,"").replace(/<[^>]+>/g,"").trim();
const isAns=(it,i)=>it.accept? it.accept.includes(i) : i===it.a;
const toks=it=>it.toks||[...it.s];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const wrongs=()=>ALL.filter(it=>ST.m[it.id]==="x");
const markedN=()=>ALL.filter(it=>ST.m[it.id]).length;
const allMarked=()=>markedN()===ALL.length;
const allFixed=()=>wrongs().every(it=>ST.fixed[it.id]);
function shortQ(it){
  if(it.short) return it.short;
  if(it.t==="find") return toks(it).join("");
  return strip(it.q);
}
let stage=1;
let quiz=null;
const main=document.getElementById("main");
function go(n){ stage=n; ST.stage=n<3?n:2; save(); render(); scrollTo(0,0); }

/* ===================== 上方步驟列 ===================== */
function paintBar(){
  const w=wrongs();
  const steps=[
    {n:1,t:"標記對錯",ok:true,sub:`${markedN()} / ${ALL.length}`},
    {n:2,t:"看詳解訂正",ok:allMarked(),sub:allMarked()?`${w.filter(it=>ST.fixed[it.id]).length} / ${w.length}`:"先標記完"},
    {n:3,t:"錯題總測驗",ok:allMarked()&&w.length>0&&allFixed(),sub:ST.best?`最佳 ${ST.best}`:(w.length?`${w.length} 題`:"—")}
  ];
  document.getElementById("steps").innerHTML=steps.map(s=>`<button class="stp ${stage===s.n?"on":""}" data-go="${s.n}" ${s.ok?"":"disabled"}><b>${["①","②","③"][s.n-1]} ${s.t}</b><small>${s.sub}</small></button>`).join("");
}
document.getElementById("steps").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b && !b.disabled) go(+b.dataset.go); });

const NUM=["一","二","三","四","五","六"];
function paintLessons(){
  document.getElementById("lessons").innerHTML=LIST.map(l=>{const ok=!!LESSONS[l.n];return `<button class="lsn ${l.n===CUR?"on":""}" data-lesson="${l.n}" ${ok?"":"disabled"}><b>第${NUM[l.n-1]}課</b><small>${ok?l.name:l.name+"・準備中"}</small></button>`}).join("");
  document.getElementById("lessonlabel").textContent=`三上國語 · 第${NUM[CUR-1]}課〈${LESSONS[CUR].name}〉單元卷`;
}
document.getElementById("lessons").addEventListener("click",e=>{
  const b=e.target.closest("[data-lesson]"); if(!b||b.disabled) return;
  const n=+b.dataset.lesson; if(n===CUR) return;
  load(n); try{ history.replaceState(null,"","#l"+n); }catch(_){ location.hash="l"+n; }
  render(); scrollTo(0,0);
});
function render(){
  paintLessons();
  if(stage===1) renderMark();
  else if(stage===2) renderFix();
  else renderQuiz();
  paintBar();
}

/* ===================== ① 標記 ===================== */
function renderMark(){
  const seat=ST.seat||"";
  main.innerHTML=`
  <div class="intro"><h2>① 標記對錯</h2><p>看著老師改好的考卷，每一題點「對」或「錯」。整個大題都對，可以按「這大題全對」。</p>
    <label class="seat" for="seat">我的座號<input id="seat" inputmode="numeric" maxlength="3" value="${esc(seat)}" placeholder="例：12"></label></div>
  ${SECTIONS.map(s=>`
    <section class="msec">
      <div class="sec-head"><span class="sec-no">${s.no}、</span><h2>${s.title}</h2><span class="pts">${s.pts}</span><button class="allok" data-allok="${s.no}">這大題全對</button></div>
      <ul class="mlist">${s.items.map(it=>{const v=ST.m[it.id];return `
        <li class="mrow ${v==="x"?"isx":v==="ok"?"isok":""}" id="r-${it.id}">
          <span class="mno">${it.label}</span><span class="mq">${esc(shortQ(it))}</span>
          <span class="mark"><button class="m-ok" data-mark="ok" data-id="${it.id}" aria-pressed="${v==="ok"}">對</button><button class="m-x" data-mark="x" data-id="${it.id}" aria-pressed="${v==="x"}">錯</button></span>
        </li>`}).join("")}</ul>
    </section>`).join("")}
  <div class="next">
    <p>${allMarked()?`標記完成！你錯了 <b>${wrongs().length}</b> 題。`:`還有 <b>${ALL.length-markedN()}</b> 題沒有標記。`}</p>
    ${allMarked()
      ? (wrongs().length?`<button class="btn big" data-go="2">下一步：看詳解訂正 →</button>`:`<p class="cheer">全部都對，太厲害了！不用訂正。</p>`)
      : `<button class="btn ghost big" id="tofirst">跳到沒標記的題目</button>`}
  </div>`;
}

/* ===================== ② 看詳解訂正 ===================== */
function detailBody(it){
  if(it.t==="mc"){
    const btns=it.opts.map((o,i)=>`<span class="opt ${isAns(it,i)?"right":"dim"}">${esc(o)}${isAns(it,i)?'<span class="circle"></span>':""}</span>`).join("");
    return `<div class="q">${it.q}</div><div class="opts ${it.long?"long":""}">${btns}</div><div class="ex"><h3>詳解</h3>${it.ex}</div>`;
  }
  if(it.t==="find"){
    const cs=toks(it).map((c,i)=>i===it.w?`<span class="ch found ${c.length>1?"w":""}">${c}</span><span class="ch fixed w">${it.opts[it.a]}</span>`:`<span class="ch ${/^[，。、！？]$/.test(c)?"p":""} ${c.length>1?"w":""}">${c}</span>`).join("");
    return `<div class="chars static">${cs}</div><p class="answer">「${toks(it)[it.w]}」要改成「<b>${it.opts[it.a]}</b>」</p><div class="ex"><h3>詳解</h3>${it.ex}</div>`;
  }
  if(it.t==="match"){
    return `<ul class="pairs">${it.chars.map(c=>`<li><span class="pc">${c}</span><span class="pr">${it.ans[c]}</span><span class="ph">${it.hints[c]}</span></li>`).join("")}</ul><div class="ex"><h3>詳解</h3>${it.ex}</div>`;
  }
  const checks=(ST.ck||{})[it.id]||[];
  return `<div class="q">${it.q}</div><div class="ex"><h3>參考答案</h3>${it.ans}</div>
    <p class="step">對照你的考卷，想想看哪裡要改：</p>
    <ul class="checks">${it.checks.map((c,i)=>`<li><label><input type="checkbox" id="${it.id}-c${i}" data-ck="${i}" data-id="${it.id}" ${checks[i]?"checked":""}>${c}</label></li>`).join("")}</ul>`;
}
function renderFix(){
  const w=wrongs(), done=w.filter(it=>ST.fixed[it.id]).length;
  main.innerHTML=`
  <div class="intro"><h2>② 看詳解訂正</h2><p>這裡只有你錯的 ${w.length} 題。看完詳解，拿出訂正本把正確答案寫下來（錯字寫三遍），寫好了再按「我訂正好了」。</p></div>
  ${w.map(it=>{const f=ST.fixed[it.id];return `
    <article class="card ${f?"done":"wrong"}" id="c-${it.id}">
      <div class="ctop"><span class="qno">${it.sec.no}、${it.sec.title}・${it.label}</span>${f?`<span class="badge">已訂正</span>`:""}</div>
      ${it.sec.passage?`<details class="passage"><summary class="ptag">閱讀短文${PTITLE?"　〈"+PTITLE+"〉":""}（點開）</summary>${PASSAGE.map(p=>`<p>${p}</p>`).join("")}</details>`:""}
      ${detailBody(it)}
      <div class="fixrow"><span class="copy">抄到訂正本：<b>${esc(it.fix)}</b></span>
        <button class="btn ${f?"ghost":"ok"}" data-fix="${it.id}">${f?"✓ 已訂正（點一下取消）":"我訂正好了"}</button></div>
    </article>`}).join("")}
  <div class="next">
    <p>${done===w.length?`全部訂正好了！來看看你是不是真的會了。`:`已訂正 <b>${done}</b> / ${w.length} 題，全部訂正好才能開始測驗。`}</p>
    ${done===w.length?`<button class="btn big" data-go="3">開始錯題總測驗 →</button>`:""}
  </div>`;
}

/* ===================== ③ 錯題總測驗 ===================== */
function asQ(it){
  // 自己寫的題目，測驗時換成可以自動批改的類題
  if(it.t==="self") return {...it,...it.test,t:"mc",fromSelf:true};
  return it;
}
function buildQuiz(list){
  quiz={list:list.map(it=>{
    const q=asQ(it);
    let order=null;
    if(q.t==="mc"){ const keep=/^[①○✕]/.test(q.opts[0]); order= keep? q.opts.map((_,i)=>i) : shuffle(q.opts.map((_,i)=>i)); }
    return {id:it.id,q,order,res:null,st:{}};
  }), i:0};
}
function renderQuiz(){
  if(!quiz) buildQuiz(wrongs());
  const n=quiz.list.length;
  if(quiz.i>=n) return renderResult();
  const cur=quiz.list[quiz.i], q=cur.q, st=cur.st;
  let body="", done=cur.res!==null;
  if(q.t==="mc"){
    const btns=cur.order.map(i=>{
      let c="opt"; if(done){ c+= isAns(q,i)?" right":(i===st.pick?" no":" dim"); }
      return `<button class="${c}" data-o="${i}" ${done?"disabled":""}>${esc(q.opts[i])}${done&&(cur.res?i===st.pick:i===q.a)?'<span class="circle"></span>':""}</button>`;
    }).join("");
    body=`<div class="q">${q.q}</div><div class="opts ${q.long?"long":""}">${btns}</div>`;
  }else if(q.t==="find"){
    const chars=toks(q);
    const cs=chars.map((c,i)=>{
      const p=/^[，。、！？]$/.test(c); let cls="ch"+(p?" p":"")+(c.length>1?" w":""), txt=c;
      if(i===q.w && (st.found||done)) cls+= (done&&cur.res)?" fixed":" found";
      if(done && cur.res && i===q.w) txt=q.opts[q.a];
      if(st.badTap===i) cls+=" bad";
      return `<button class="${cls}" data-c="${i}" ${p||st.found||done?"disabled":""}>${txt}</button>`;
    }).join("");
    let step2="";
    if(st.found){
      const btns=q.opts.map((o,i)=>{let c="opt"; if(done){ c+= i===q.a?" right":(i===st.pick?" no":" dim"); } return `<button class="${c}" data-o="${i}" ${done?"disabled":""}>${o}${done&&i===q.a?'<span class="circle"></span>':""}</button>`;}).join("");
      step2=`<p class="step">② 要改成哪${q.toks?"一個語詞":"個字"}？</p><div class="opts">${btns}</div>`;
    }
    body=`${st.found||done?"":`<p class="step">① 點出${q.toks?"用錯的語詞":"寫錯的字"}</p>`}<div class="chars">${cs}</div>${step2}`;
  }else if(q.t==="match"){
    st.pairs=st.pairs||{}; st.miss=st.miss||0;
    const used=Object.values(st.pairs);
    const left=q.chars.map(c=>`<button class="mbtn ${st.pairs[c]?"done":""} ${st.sel===c?"sel":""}" data-mc="${c}" ${st.pairs[c]||done?"disabled":""}>${c}${st.pairs[c]?`<small>→ ${st.pairs[c]}</small>`:""}</button>`).join("");
    const right=q.rads.map(r=>`<button class="mbtn ${used.includes(r)?"done":""}" data-mr="${r}" ${used.includes(r)||done?"disabled":""}>${r}</button>`).join("");
    body=`<p class="step">${done?"":st.sel?`已選「${st.sel}」，再點它的部首`:"先點左邊一個字，再點右邊的部首（要全部連對才算答對）"}</p><div class="match"><div class="mcol"><h4>字</h4>${left}</div><div class="mcol"><h4>部首</h4>${right}</div></div>${st.miss&&!done?`<p class="hint">連錯 ${st.miss} 次，這題會算錯，但還是要連完喔。</p>`:""}`;
  }
  const passage = BY[cur.id].sec.passage ? `<div class="passage"><span class="ptag">閱讀短文${PTITLE?"　〈"+PTITLE+"〉":""}</span>${PASSAGE.map(p=>`<p>${p}</p>`).join("")}</div>`:"";
  const fb = done ? `<div class="ex ${cur.res?"":"bad"}"><h3>${cur.res?"答對了！":"還不太熟，再看一次"}</h3>${q.ex}</div>` : "";
  main.innerHTML=`
    <div class="intro"><h2>③ 錯題總測驗</h2><p>這些是你考卷上錯的題目。不能看詳解，自己作答，每題只有一次機會。</p></div>
    <div class="qhead"><span>第 <b>${quiz.i+1}</b> / ${n} 題</span><span>${BY[cur.id].sec.no}、${BY[cur.id].sec.title}${q.fromSelf?"（類題）":""}</span></div>
    <div class="progress"><i style="width:${quiz.i/n*100}%"></i></div>
    ${passage}
    <article class="card quiz" id="qcard">${body}${fb}</article>
    ${done?`<div class="next"><button class="btn big" id="qnext">${quiz.i===n-1?"看測驗結果":"下一題 →"}</button></div>`:""}`;
  const nx=document.getElementById("qnext"); if(nx) nx.focus({preventScroll:true});
}
function renderResult(){
  const n=quiz.list.length, ok=quiz.list.filter(x=>x.res).length, miss=quiz.list.filter(x=>!x.res);
  const score=`${ok} / ${n}`;
  ST.last={ok,n,time:Date.now()};
  if(!ST.bestN || ok/n > ST.bestN){ ST.bestN=ok/n; ST.best=score; }
  save();
  const word= ok===n?"全部會了":ok/n>=.7?"快好了":"再加油";
  main.innerHTML=`
    <div class="result">
      <div class="intro"><h2>錯題總測驗結果</h2></div>
      <div class="scorecard">
        ${ST.seat?`<p class="who">${esc(ST.seat)} 號</p>`:""}
        <div class="stamp">${word}</div>
        <p class="big">答對 ${ok} / ${n} 題</p>
        <p class="sub">做完拿給老師看這個畫面</p>
      </div>
      ${miss.length?`<div class="wronglist"><h3>還要再練的 ${miss.length} 題</h3>${miss.map(x=>{const it=BY[x.id];return `<div class="witem"><p><b>${it.sec.no}、${it.label}</b>　${esc(shortQ(it))}</p><p class="ans">抄到訂正本：${esc(it.fix)}</p></div>`}).join("")}</div>`:`<p class="cheer">錯的題目全部都會了，訂正完成！</p>`}
      <div class="actions">
        ${miss.length?`<button class="btn big" id="again">再測一次答錯的 ${miss.length} 題</button>`:""}
        <button class="btn ghost" id="all">全部錯題重新測驗</button>
        <button class="btn ghost" data-go="2">回去看詳解</button>
      </div>
    </div>`;
  paintBar();
}

/* ===================== 互動 ===================== */
main.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(+g.dataset.go); return; }
  if(stage===1){
    const mk=e.target.closest("[data-mark]");
    if(mk){ const id=mk.dataset.id; ST.m[id]= ST.m[id]===mk.dataset.mark?undefined:mk.dataset.mark; if(ST.m[id]!=="x") delete ST.fixed[id]; save(); const y=scrollY; render(); scrollTo(0,y); return; }
    const al=e.target.closest("[data-allok]");
    if(al){ SECTIONS.find(s=>s.no===al.dataset.allok).items.forEach(it=>{ ST.m[it.id]="ok"; delete ST.fixed[it.id]; }); save(); const y=scrollY; render(); scrollTo(0,y); return; }
    if(e.target.id==="tofirst"){ const it=ALL.find(it=>!ST.m[it.id]); const r=document.getElementById("r-"+it.id); if(r){ r.scrollIntoView({block:"center"}); r.classList.add("flash"); setTimeout(()=>r.classList.remove("flash"),1200);} return; }
    return;
  }
  if(stage===2){
    const f=e.target.closest("[data-fix]");
    if(f){ const id=f.dataset.fix; ST.fixed[id]=!ST.fixed[id]; save(); const y=scrollY; render(); scrollTo(0,y); }
    return;
  }
  if(stage===3){
    if(e.target.id==="qnext"){ quiz.i++; render(); scrollTo(0,0); return; }
    if(e.target.id==="again"){ buildQuiz(quiz.list.filter(x=>!x.res).map(x=>BY[x.id])); render(); scrollTo(0,0); return; }
    if(e.target.id==="all"){ buildQuiz(wrongs()); render(); scrollTo(0,0); return; }
    if(!quiz || quiz.i>=quiz.list.length) return;
    const cur=quiz.list[quiz.i], q=cur.q, st=cur.st;
    if(cur.res!==null) return;
    if(q.t==="mc"){ const b=e.target.closest("[data-o]"); if(!b) return; st.pick=+b.dataset.o; cur.res= isAns(q,st.pick); render(); return; }
    if(q.t==="find"){
      const c=e.target.closest("[data-c]");
      if(c && !st.found){ const i=+c.dataset.c; if(i===q.w){ st.found=true; } else { st.badTap=i; st.found=true; cur.res=false; } render(); return; }
      const b=e.target.closest("[data-o]"); if(b){ st.pick=+b.dataset.o; cur.res= st.pick===q.a && st.badTap===undefined; render(); }
      return;
    }
    if(q.t==="match"){
      const l=e.target.closest("[data-mc]"), r=e.target.closest("[data-mr]");
      if(l){ st.sel=l.dataset.mc; render(); return; }
      if(r && st.sel){
        const good=q.ans[st.sel]===r.dataset.mr;
        if(good){ st.pairs[st.sel]=r.dataset.mr; st.sel=undefined; if(Object.keys(st.pairs).length===q.chars.length) cur.res= st.miss===0; }
        else { st.miss=(st.miss||0)+1; }
        render(); if(!good){ const n=document.querySelector(`[data-mr="${r.dataset.mr}"]`); if(n) n.classList.add("bad"); }
      }
    }
  }
});
main.addEventListener("change",e=>{
  const ck=e.target.closest("[data-ck]");
  if(ck){ ST.ck=ST.ck||{}; const a=ST.ck[ck.dataset.id]=ST.ck[ck.dataset.id]||[]; a[+ck.dataset.ck]=ck.checked; save(); }
});
main.addEventListener("input",e=>{ if(e.target.id==="seat"){ ST.seat=e.target.value.trim(); save(); } });
document.getElementById("restart").addEventListener("click",e=>{
  const b=e.currentTarget;
  if(b.dataset.sure){ ST={m:{},fixed:{}}; save(); quiz=null; stage=1; render(); scrollTo(0,0); b.textContent="清除紀錄，從頭開始"; delete b.dataset.sure; return; }
  b.dataset.sure="1"; b.textContent="真的要清除嗎？再點一次確定"; setTimeout(()=>{ delete b.dataset.sure; b.textContent="清除紀錄，從頭開始"; },3000);
});

/* ===================== QR code ===================== */
function defaultURL(){
  const h=location.hostname||"";
  const hosted=/^https?:$/.test(location.protocol) && !/claude|anthropic|localhost|127\.0\.0\.1/.test(h);
  return (hosted ? location.href.split("#")[0] : ARTIFACT_URL) + "#l" + CUR;
}
function qrURL(){ let c=null; try{ c=localStorage.getItem("qr-url-exam"); }catch(e){} return c ? c.split("#")[0]+"#l"+CUR : defaultURL(); }
let lastFocus=null;
function drawQR(url){
  const box=document.getElementById("qrcode");
  document.getElementById("qrurl").textContent=url;
  const cs=getComputedStyle(document.documentElement);
  try{
    const q=qrcode(0,"M"); q.addData(url); q.make();
    const n=q.getModuleCount(); let d="";
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c} ${r}h1v1h-1z`;
    const dark=cs.getPropertyValue("--qr-dark").trim()||"#000", light=cs.getPropertyValue("--qr-light").trim()||"#fff";
    box.innerHTML=`<svg viewBox="-2 -2 ${n+4} ${n+4}" shape-rendering="crispEdges" role="img" aria-label="QR code：${esc(url)}"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="${light}"/><path d="${d}" fill="${dark}"/></svg>`;
  }catch(e){ box.innerHTML='<p style="line-height:1.6;color:#000">網址太長，無法做成 QR code。請學生直接輸入下方網址。</p>'; }
}
function openQR(){ document.getElementById("qrl").textContent=`第${NUM[CUR-1]}課〈${LESSONS[CUR].name}〉`; lastFocus=document.activeElement; const u=qrURL(); document.getElementById("qrinput").value=u; drawQR(u); document.getElementById("qr").hidden=false; document.getElementById("qrclose").focus(); }
function closeQR(){ document.getElementById("qr").hidden=true; if(lastFocus) lastFocus.focus(); }
document.getElementById("showqr").onclick=openQR;
document.getElementById("qrclose").onclick=closeQR;
document.getElementById("qr").addEventListener("click",e=>{ if(e.target.id==="qr") closeQR(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !document.getElementById("qr").hidden) closeQR(); });
document.getElementById("qrsave").onclick=()=>{ let v=document.getElementById("qrinput").value.trim(); if(!v) return; if(!/^https?:\/\//.test(v)) v="https://"+v; try{ localStorage.setItem("qr-url-exam",v); }catch(e){} document.getElementById("qrinput").value=v; drawQR(v); };
document.getElementById("qrreset").onclick=()=>{ try{ localStorage.removeItem("qr-url-exam"); }catch(e){} const v=defaultURL(); document.getElementById("qrinput").value=v; drawQR(v); };

(function(){
  let n=0; const m=/^#l([1-6])$/.exec(location.hash||"");
  if(m && LESSONS[+m[1]]) n=+m[1];
  if(!n){ try{ const v=+localStorage.getItem("exam-review-last"); if(LESSONS[v]) n=v; }catch(e){} }
  load(n||1);
})();
render();
</script>
